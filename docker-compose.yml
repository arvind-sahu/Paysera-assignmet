services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "8080:8080"
    command: php -S 0.0.0.0:8080 -t public

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fund_transfer
      MYSQL_USER: fund_user
      MYSQL_PASSWORD: fund_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufund_user", "-pfund_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    volumes:
      - ./load-tests:/scripts
    depends_on:
      - php
    environment:
      API_KEY: dev-api-key-001
      BASE_URL: http://php:8080
    entrypoint: ["k6", "run", "/scripts/transfer.js"]

volumes:
  mysql_data:
