security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        api_user_provider:
            id: App\Infrastructure\Security\ApiUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|health)
            security: false
        api:
            pattern: ^/api
            stateless: true
            custom_authenticators:
                - App\Infrastructure\Security\ApiKeyAuthenticator
            entry_point: App\Infrastructure\Security\ApiKeyAuthenticator

    access_control:
        - { path: ^/api, roles: ROLE_API }
